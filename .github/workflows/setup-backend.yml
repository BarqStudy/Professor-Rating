name: Set up Miyar backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/setup-backend.yml"

permissions:
  contents: read

concurrency:
  group: miyar-database-migrations
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'bbnsorjxgehvoddluvyo' }}
      ADMIN_AUTH_IDS: ${{ vars.ADMIN_AUTH_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check required configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re
          required = ['SUPABASE_ACCESS_TOKEN', 'SUPABASE_DB_PASSWORD', 'SUPABASE_PROJECT_REF']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing settings: ' + ', '.join(missing))
          if not re.fullmatch(r'[a-z0-9]{20}', os.environ['SUPABASE_PROJECT_REF']):
              raise SystemExit('SUPABASE_PROJECT_REF must be the project reference, not its URL.')
          if os.environ.get('ADMIN_AUTH_IDS') and not re.fullmatch(r'[a-fA-F0-9-]{36}(?:,[a-fA-F0-9-]{36})*', os.environ['ADMIN_AUTH_IDS']):
              raise SystemExit('ADMIN_AUTH_IDS must contain Supabase Auth user UUIDs separated by commas.')
          PY
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Link project and apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase db push --linked --yes
      - name: Configure private backend secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          secret_file="$RUNNER_TEMP/miyar-secrets.env"
          trap 'rm -f "$secret_file"' EXIT
          python3 - <<'PY'
          import os
          from pathlib import Path
          values = {
              'ADMIN_AUTH_IDS': os.environ['ADMIN_AUTH_IDS'],
              'ALLOWED_ORIGINS': 'https://barqstudy.github.io,https://miyar.website,https://www.miyar.website',
          }
          for value in values.values():
              if '\n' in value or '\r' in value:
                  raise SystemExit('A secret value contains an unexpected newline.')
          target = Path(os.environ['RUNNER_TEMP']) / 'miyar-secrets.env'
          target.write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          target.chmod(0o600)
          PY
          supabase secrets set --env-file "$secret_file" --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Deploy Google-authenticated API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy miyar --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Verify public catalogue endpoint
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://' + os.environ['SUPABASE_PROJECT_REF'] + '.supabase.co/functions/v1/miyar'
          request = urllib.request.Request(url, data=b'{"action":"catalogue"}', headers={'Content-Type': 'application/json', 'Origin': 'https://miyar.website'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          if not all(isinstance(data.get(key), list) for key in ['universities', 'colleges', 'majors', 'doctors']):
              raise SystemExit('Unexpected catalogue response.')
          if not any(u.get('name') == 'جامعة نجران' for u in data['universities']):
              raise SystemExit('University catalogue migration is missing.')
          if any(not c.get('university_id') for c in data['colleges']):
              raise SystemExit('A college is missing its university.')
          print('Backend is reachable. Public catalogue contains', len(data['colleges']), 'colleges.')
          PY
